<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Remote administration · Plex Cast Explorer</title>
<style>body{background:#101218;color:#eee;font:16px system-ui;min-height:100vh;display:grid;place-items:center}main{background:#1b1e27;border:1px solid #393b44;border-radius:14px;padding:30px;width:min(380px,90vw)}input,button{display:block;width:100%;box-sizing:border-box;padding:12px;font:inherit;margin-top:12px}input{background:#101218;color:white;border:1px solid #555;border-radius:6px}button{background:#dca956;border:0;border-radius:7px;font-weight:bold}small{color:#b3b4c2}#error{color:#ff9e9e}</style></head><body><main><h1>Remote administration</h1><p>Use your separate administrator password. Access is restricted to authorized VPN addresses.</p><form id="form"><label for="password">Administrator password</label><input id="password" type="password" autocomplete="current-password" minlength="16" required autofocus><button id="submit">Unlock administration</button></form><p id="error" role="alert"></p><small>Never open the HTTP service to the public internet. <a style="color:#dca956" href="/">Return to gallery</a></small></main><script>document.getElementById('form').addEventListener('submit',async function(e){e.preventDefault();const btn=document.getElementById('submit');btn.disabled=true;try{const res=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const j=await res.json();if(!res.ok)throw Error(j.error||'Unable to authenticate');location.assign('/');}catch(e){document.getElementById('error').textContent=e.message;btn.disabled=false;}});</script></body></html>
