name: Feature request
description: Log a proposal for after the 1.0 feature freeze; no new features are accepted before GA.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Problem or need
      description: Explain what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe a potential post-1.0 change. Feature additions are deferred until the general release is finished.
    validations:
      required: true
